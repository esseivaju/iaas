node:
  cluster: test-cluster
  id: test-id

admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9191

dynamic_resources:
  cds_config:
    resource_api_version: V3
    path_config_source:
      path: "/envoy-config/xds/cds.yaml"
      watched_directory: {"path": "/envoy-config/xds"}
  lds_config:
    resource_api_version: V3
    path_config_source:
      path: "/envoy-config/xds/lds.yaml"
      watched_directory: {"path": "/envoy-config/xds"}
