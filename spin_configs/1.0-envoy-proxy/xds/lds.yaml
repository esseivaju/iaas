version_info: "0"
resources:
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9097
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: tcp_proxy
              http2_protocol_options: {}
              route_config:
                name: cluster-route
                validate_clusters: false
                virtual_hosts:
                  - name: cluster
                    domains: ["*"]
                    routes:
                      - match:
                          prefix: "/"
                          grpc: {}
                        route:
                          cluster: triton-inference-service
                          timeout: 600s
                          idle_timeout: 0s
                          retry_policy:
                            retry_on: "5xx,reset,gateway-error,cancelled,resource-exhausted,unavailable"  # types of failures to retry
                            num_retries: 3                      # max retries per request
                            per_try_timeout: 300s                # optional: timeout per retry attempt
              codec_type: AUTO
              http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    per_connection_buffer_limit_bytes: 150000000
